# Site identity
title: Pisek Kultavewuti
tagline: AI systems, agents, and the work of making them useful.
description: >-
  Writing by Pisek Kultavewuti on AI systems, agent architecture and evaluation,
  and what it actually takes to put AI to work inside a business. Advisory and
  training through Case Done.
author: Pisek Kultavewuti

url: "https://kpisek.com"
# Previews still serve from the project page, so the repo subpath stays until the
# custom domain resolves. Every internal path goes through relative_url, which
# makes removing this line the entire migration.
baseurl: "/casedone"

# Contact and elsewhere
substack_url: "https://casedonebyai.substack.com"
linkedin_url: "https://www.linkedin.com/company/casedonebyai"
github_url: "https://github.com/casedone"

# Build settings
markdown: kramdown
# GitHub Pages builds in UTC; front matter is written +0700, so dates would render
# a day early without this.
timezone: Asia/Bangkok
permalink: /writing/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: article

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - CNAME
