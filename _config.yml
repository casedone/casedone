# Site identity
title: Pisek Kultavewuti
tagline: AI systems, agents, and the work of making them useful.
description: >-
  Writing by Pisek Kultavewuti on AI systems, agent architecture and evaluation,
  and what it actually takes to put AI to work inside a business.
author: Pisek Kultavewuti

url: "https://kpisek.com"
# The site is served from the domain root by Cloudflare Pages, so there is no
# baseurl. Every internal path still goes through relative_url, which is what
# makes this a one-line setting rather than a find-and-replace.
baseurl: ""

# Contact and elsewhere. There is no newsletter and no feed: LinkedIn is the
# only channel, so these are the only outbound links the site needs.
linkedin_url: "https://www.linkedin.com/in/kpisek"
github_url: "https://github.com/psklight"

# Build settings
markdown: kramdown
# GitHub Pages builds in UTC; front matter is written +0700, so dates would render
# a day early without this.
timezone: Asia/Bangkok
permalink: /writing/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: article

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - CNAME
  # Retired pages kept for reference. Jekyll already skips underscore-prefixed
  # directories; this line documents why _archive exists.
  - _archive
